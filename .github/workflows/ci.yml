name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported compilers (see README.md)
          - name: Linux GCC 10 (minimum)
            os: ubuntu-22.04
            cxx: g++-10
            install: g++-10
          - name: Linux Clang 13 (minimum)
            os: ubuntu-22.04
            cxx: clang++-13
            install: clang-13
          # Current compilers
          - name: Linux GCC 13
            os: ubuntu-24.04
            cxx: g++-13
          - name: Linux GCC 14
            os: ubuntu-24.04
            cxx: g++-14
          - name: Linux Clang 18
            os: ubuntu-24.04
            cxx: clang++-18
          - name: macOS Apple Clang
            os: macos-latest
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        if: matrix.install
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.install }}

      - name: Compiler version
        run: ${{ matrix.cxx }} --version

      # Some Linux runner kernels use more ASLR entropy than older sanitizer runtimes support
      - name: Configure ASLR for sanitizers
        if: runner.os == 'Linux'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build and run examples
        run: make run-examples CXX=${{ matrix.cxx }}

      - name: Test suite
        run: make check CXX=${{ matrix.cxx }}

      - name: Test suite (AddressSanitizer + UndefinedBehaviorSanitizer)
        run: make check-sanitize CXX=${{ matrix.cxx }}

      - name: Test suite (MATL_NO_DEBUG)
        run: make check-nodebug CXX=${{ matrix.cxx }}

      - name: Test suite (MATL_ABORT_ON_ERROR)
        run: make check-abort CXX=${{ matrix.cxx }}

      - name: Build without exceptions (-fno-exceptions)
        run: make check-noexceptions CXX=${{ matrix.cxx }}

      # OpenMP: the GCC jobs (Apple Clang has no OpenMP runtime, and the Linux Clang images would
      # need libomp)
      - name: Test suite (OpenMP, 4 threads)
        if: startsWith(matrix.cxx, 'g++')
        run: make check-openmp CXX=${{ matrix.cxx }}

      - name: Build benchmarks
        run: make benchmarks CXX=${{ matrix.cxx }}

      - name: CMake build and test
        run: |
          cmake -S . -B build/cmake -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
                -DMATL_BUILD_EXAMPLES=ON -DMATL_BUILD_BENCHMARKS=ON -DMATL_WARNINGS_AS_ERRORS=ON
          cmake --build build/cmake --parallel 4
          cd build/cmake && ctest --output-on-failure

      - name: CMake install and find_package
        run: |
          cmake --install build/cmake --prefix "$PWD/build/install"
          cmake -S tests/install -B build/install-test -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
                -DCMAKE_PREFIX_PATH="$PWD/build/install"
          cmake --build build/install-test
          ./build/install-test/matl_install_test

      - name: Upload MATL debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: matl-test-logs-${{ matrix.os }}-${{ matrix.cxx }}
          path: build/*.log
          if-no-files-found: ignore
